<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Data Viewer</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2 class="text-center">Stock Data Viewer</h2>
    
    <div class="container">
        <!-- Left Side - Company List -->
        <ul id="companyList" class="list-group company-list"></ul>

        <!-- Right Side - Chart and Chat Box -->
        <div class="chart-container">
            <canvas id="stockChart"></canvas>
            <div class="chat-box" id="chatBox">Select a company to view stock details...</div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
